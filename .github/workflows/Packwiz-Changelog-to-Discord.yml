name: Packwiz Discord Changelog (Preview)

on: [push]

permissions:
  contents: read

# Run alongside Changelog-to-Discord.yml until the new sender is approved.
# Avoid concurrency groups: pending push notifications must not be replaced.
jobs:
  notify:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Send parallel packwiz preview
        uses: ./.github/actions/packwiz-changelog
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          username: CreateVC Packwiz Preview
          avatar-url: https://raw.githubusercontent.com/Jammersmurph/CreateVC-Assets/main/createvc_smp_logo.png
          image-url: https://raw.githubusercontent.com/Jammersmurph/CreateVC-Assets/main/createvc_smp_logo.png
          color: "7DBBE6"
          description: "Packwiz changelog preview — running alongside the existing CreateVC changelog."
          # Pings are opt-in. The original sender is disabled; this sender does
          # not ping anyone unless mention inputs below are explicitly enabled.
          # To enable pings: turn on Discord Developer Mode, then Copy ID on a
          # role/user. Supply bare numeric IDs, separated by commas or spaces.
          # Uncommenting these pings on EVERY push, first message only.
          # Roles must be mentionable/permitted. No pings are enabled currently.
          # mention-roles: "1447355271830704170"
          # mention-users: "YOUR_NUMERIC_USER_ID"
          # mention-everyone: "false"
          custom-links: |
            [{"label":"Website","url":"https://www.createvc.org/"},
             {"label":"Downloads","url":"https://www.createvc.org/pack"}]
          exclude-paths: |
            .github/**
            builds/**
            prism-light/**
          max-commits: "20"
          max-items: "100"
          max-messages: "5"
