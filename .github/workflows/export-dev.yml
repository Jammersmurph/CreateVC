name: Export Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

# Serialize builds per branch instead of letting them race. A duplicate push
# event otherwise makes both runs try to commit builds/, and the loser fails
# with a non-fast-forward rejection. Queued (rather than cancelled) so a
# legitimate follow-up commit is never silently dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Validate index hashes match actual files
        run: |
          python3 -c "
          import hashlib, sys, re
          index = open('index.toml').read()
          errors = []
          for m in re.finditer(r'file = \"(mods/[^\"]+\.pw\.toml)\"\nhash = \"([^\"]+)\"', index):
              filepath = m.group(1)
              expected = m.group(2)
              actual = hashlib.sha256(open(filepath, 'rb').read()).hexdigest()
              if actual != expected:
                  errors.append(f'MISMATCH: {filepath}: expected {expected}, got {actual}')
          if errors:
              print('Index validation FAILED — metafile hashes in index.toml are stale.')
              for e in errors:
                  print(f'  {e}')
              print('Run packwiz refresh on this branch and commit the result.')
              sys.exit(1)
          else:
              print('Index validation passed.')
          "

      - name: Validate optional mod metadata
        run: |
          python3 -c "
          import glob, sys, tomllib

          problems = []
          optional_names = []

          metafiles = sorted(glob.glob('mods/*.pw.toml')) \
              + sorted(glob.glob('resourcepacks/*.pw.toml'))
          for path in metafiles:
              with open(path, 'rb') as handle:
                  data = tomllib.load(handle)
              option = data.get('option')
              if option is None:
                  continue
              name = data.get('name', path)
              optional_names.append(name)
              if option.get('optional') is not True:
                  problems.append(f'{path}: option.optional must be true')
              if option.get('default') is not False:
                  problems.append(
                      f'{path}: option.default must be false so the mod stays opt-in')
              description = option.get('description')
              if not isinstance(description, str) or not description.strip():
                  problems.append(f'{path}: option.description must be a non-empty string')

          if problems:
              print('Optional mod validation FAILED')
              for problem in problems:
                  print(f'  {problem}')
              sys.exit(1)

          print(f'Validated {len(optional_names)} optional mods:')
          for name in optional_names:
              print(f'  - {name}')
          "

      - name: Build Prism Light pack
        run: bash .github/scripts/build-light-pack.sh CreateVC-Light-dev.zip

      - name: Validate Prism Light pack
        run: |
          python3 -c "
          import configparser, io, json, sys, zipfile
          path = 'CreateVC-Light-dev.zip'
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              required = {
                  'instance.cfg',
                  'mmc-pack.json',
                  'minecraft/config/lambdynlights.toml',
                  'minecraft/config/renderscale.json5',
                  'minecraft/mods/packupdater.jar',
                  'minecraft/mods/renderscale-1.4.0-alpha.6-neoforge+1.21.1.jar',
                  'minecraft/config/packupdater.properties',
              }
              missing = required - names
              if missing:
                  sys.exit(f'Missing Light pack files: {sorted(missing)}')

              instance_text = archive.read('instance.cfg').decode()
              if '/home/' in instance_text or 'JavaPath=' in instance_text:
                  sys.exit('Light instance contains a machine-specific Java path')
              config = configparser.ConfigParser()
              config.read_file(io.StringIO(instance_text))
              general = config['General']
              if general.getboolean('AutomaticJava') is not True:
                  sys.exit('AutomaticJava must be enabled')
              if general.getboolean('OverrideJavaLocation') is not False:
                  sys.exit('OverrideJavaLocation must be disabled')
              if general.getint('MaxMemAlloc') != 2048:
                  sys.exit('Light pack must allocate at most 2048 MB')

              components = json.loads(archive.read('mmc-pack.json'))['components']
              versions = {component['uid']: component['version'] for component in components}
              if versions.get('net.minecraft') != '1.21.1':
                  sys.exit('Unexpected Minecraft version')
              if versions.get('net.neoforged') != '21.1.250':
                  sys.exit('Unexpected NeoForge version')

              lights = archive.read('minecraft/config/lambdynlights.toml').decode()
              if 'mode = \"off\"' not in lights:
                  sys.exit('Dynamic lighting is not disabled by default')

              render_scale = json.loads(archive.read('minecraft/config/renderscale.json5'))
              if render_scale.get('scale') != 0.75:
                  sys.exit('RenderScale is not configured to 0.75')
          print('Prism Light pack validation passed.')
          "

      - name: Exclude updater-managed files from export
        run: |
          mkdir -p /tmp/createvc-export-excluded

          # FTB Library and any other CurseForge-sourced mod cannot be referenced by
          # the Modrinth pack export, so the CreateVC updater installs them instead.
          ./.github/scripts/exclude-curseforge-mods.sh /tmp/createvc-export-excluded

          # CreateVC Core is updater-managed and must not be packaged in the Modrinth export.
          if [ -e mods/createvc-core.pw.toml ]; then
            echo "Excluding mods/createvc-core.pw.toml (installed by the CreateVC updater)"
            mv mods/createvc-core.pw.toml /tmp/createvc-export-excluded/
          fi

          for path in \
            config \
            options.txt \
            optionsof.txt \
            servers.dat \
            servers.dat_old
          do
            if [ -e "$path" ]; then
              mv "$path" /tmp/createvc-export-excluded/
            fi
          done

          git checkout config/fml.toml
          git checkout config/simple-custom-early-loading.json
          git checkout config/simple-custom-early-loading/

      - name: Export to mrpack
        run: packwiz mr export -o CreateVC.mrpack

      - name: Sanity check - include PackUpdater and its config
        run: |
          python3 -c "
          import json, re, subprocess, sys, zipfile

          problems = []

          def committed(path):
              return subprocess.run(['git', 'show', f'HEAD:{path}'],
                                    capture_output=True, text=True, check=True).stdout

          metafile = committed('mods/packupdater.pw.toml')
          filename = re.search(r'^filename\s*=\s*\"([^\"]+)\"', metafile, re.M).group(1)
          url = re.search(r'^url\s*=\s*\"([^\"]+)\"', metafile, re.M).group(1)
          expected_hash = re.search(r'^hash\s*=\s*\"([^\"]+)\"', metafile, re.M).group(1)

          with zipfile.ZipFile('CreateVC.mrpack') as archive:
              manifest = json.loads(archive.read('modrinth.index.json'))

          path = 'mods/' + filename
          entry = next((item for item in manifest['files'] if item['path'] == path), None)
          if entry is None:
              problems.append(f'{path} is missing from the mrpack manifest')
          elif url not in entry.get('downloads', []):
              problems.append(f'{path} has the wrong download URL: {entry.get(\"downloads\")}')

          # Read the committed files: the export step moves config/ aside and packwiz
          # rewrites index.toml, so the working tree no longer lists them.
          index = committed('index.toml')
          for required in ('config/packupdater.properties', 'mods/packupdater.pw.toml'):
              if f'file = \"{required}\"' not in index:
                  problems.append(f'{required} is not tracked in index.toml, so the updater'
                                  ' would never receive it at runtime')

          props = committed('config/packupdater.properties')
          if 'packupdater.url=' not in props:
              problems.append('config/packupdater.properties does not set packupdater.url')
          elif 'CreateVC/main/pack.toml' not in props:
              problems.append('packupdater.url does not point at the main pack')

          # config/ is excluded from the mrpack on purpose: the updater ships it.
          if any(item['path'] == 'config/packupdater.properties' for item in manifest['files']):
              problems.append('config/packupdater.properties must not ship in the mrpack')

          if problems:
              print('PackUpdater check FAILED')
              for problem in problems:
                  print(f'  {problem}')
              sys.exit(1)

          print(f'PackUpdater check passed ({filename}, expected sha256 {expected_hash[:12]}...).')
          "

      - name: Sanity check - optional mods export as optional
        run: |
          python3 -c "
          import glob, json, sys, tomllib, zipfile

          expected = {}
          metafiles = sorted(glob.glob('mods/*.pw.toml')) \
              + sorted(glob.glob('resourcepacks/*.pw.toml'))
          for metafile in metafiles:
              with open(metafile, 'rb') as handle:
                  data = tomllib.load(handle)
              if data.get('option', {}).get('optional') is True:
                  category = metafile.split('/')[0]
                  expected[category + '/' + data['filename']] = data['name']

          if not expected:
              sys.exit('No optional mods found; expected the VR/shader opt-in set.')

          with zipfile.ZipFile('CreateVC.mrpack') as archive:
              manifest = json.loads(archive.read('modrinth.index.json'))

          exported = {entry['path']: entry.get('env', {}) for entry in manifest['files']}

          problems = []
          checked = 0
          for path, name in sorted(expected.items()):
              env = exported.get(path)
              if env is None:
                  # Excluded from the export on purpose (e.g. updater-managed).
                  print(f'SKIP  {name} is not in the mrpack manifest')
                  continue
              checked += 1
              if env.get('client') != 'optional':
                  problems.append(
                      f'{path} ({name}) is env.client={env.get(\"client\")!r}, expected \'optional\'')
              else:
                  print(f'OK    {name} -> env.client=optional, env.server={env.get(\"server\")}')

          if problems:
              print('')
              print('Optional mod export FAILED:')
              for problem in problems:
                  print(f'  {problem}')
              sys.exit(1)

          if checked == 0:
              sys.exit('No optional mods reached the mrpack manifest.')

          print(f'Optional export check passed for {checked} mods.')
          "

      - name: Sanity check - options defaults are updater-only
        run: |
          if unzip -l CreateVC.mrpack | awk '{print $4}' | grep -Eq '^overrides/options(of)?\.txt$'; then
            echo "ERROR: options.txt/optionsof.txt must not ship in the mrpack."
            exit 1
          fi
          git show HEAD:index.toml | grep -Eq '^[[:space:]]*file = "options\.txt"[[:space:]]*$'
          if grep -Eq '^[[:space:]]*options(of)?\.txt[[:space:]]*$' createvc-overwrite-allowlist.txt; then
            echo "ERROR: options.txt/optionsof.txt must never be updater-overwritable."
            exit 1
          fi
          echo "Options updater-only check passed."

      - name: Sanity check - no unexpected override mods
        run: |
          ALLOWED_OVERRIDES="\
            overrides/mods/createsa_tank_fix-\
            overrides/mods/createvc_updater_
            client-overrides/mods/\
          "
          FAILED=0
          while IFS= read -r entry; do
            allowed=false
            for pattern in $ALLOWED_OVERRIDES; do
              case "$entry" in
                *"$pattern"*) allowed=true; break;;
              esac
            done
            if [ "$allowed" = false ]; then
              echo "UNEXPECTED OVERRIDE: $entry"
              FAILED=1
            fi
          done < <(unzip -l CreateVC.mrpack 2>/dev/null \
            | awk '{print $4}' \
            | grep -E 'overrides/mods/|client-overrides/mods/')
          if [ "$FAILED" = 1 ]; then
            echo ""
            echo "ERROR: Unexpected override mods found in mrpack."
            echo "Move them to Modrinth metadata in their .pw.toml to fix this."
            exit 1
          fi
          echo "Override mods check passed."

      - name: Copy builds into repo
        run: |
          mkdir -p builds
          cp CreateVC.mrpack builds/CreateVC-dev.mrpack
          cp CreateVC-Light-dev.zip builds/CreateVC-Light-dev.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CreateVC-Dev-Exports
          path: |
            builds/CreateVC-dev.mrpack
            builds/CreateVC-Light-dev.zip
          compression-level: 0

      - name: Push builds to dev branch
        if: github.ref_type == 'branch'
        run: |
          # The branch can move under us: a duplicate push event, or another run
          # committing its own build. Rebuilding directly on top of the current
          # remote tip keeps the push a fast-forward without ever merging
          # histories, and makes a duplicate run a no-op when the artifact is
          # already committed.
          scratch="${RUNNER_TEMP:-/tmp}/createvc-build-artifacts"
          mkdir -p "$scratch"
          cp builds/CreateVC-dev.mrpack "$scratch/"
          cp builds/CreateVC-Light-dev.zip "$scratch/"

          git config user.name "CreateVC Dev CI"
          git config user.email "actions@github.com"

          git fetch -q origin "$GITHUB_REF_NAME"
          git reset --hard -q "origin/${GITHUB_REF_NAME}"
          mkdir -p builds
          cp "$scratch/CreateVC-dev.mrpack" builds/CreateVC-dev.mrpack
          cp "$scratch/CreateVC-Light-dev.zip" builds/CreateVC-Light-dev.zip

          git add -f builds/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -q -m "update dev build [skip ci]"
          git push
