name: Export & Publish

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# Every trigger builds and publishes main, so serialize all runs together.
concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract version from pack.toml
        id: version
        run: |
          VERSION=$(grep '^version =' pack.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Validate index hashes match actual files
        run: |
          python3 -c "
          import hashlib, sys, re
          index = open('index.toml').read()
          errors = []
          for m in re.finditer(r'file = \"(mods/[^\"]+\.pw\.toml)\"\nhash = \"([^\"]+)\"', index):
              filepath = m.group(1)
              expected = m.group(2)
              actual = hashlib.sha256(open(filepath, 'rb').read()).hexdigest()
              if actual != expected:
                  errors.append(f'MISMATCH: {filepath}: expected {expected}, got {actual}')
          if errors:
              print('Index validation FAILED — metafile hashes in index.toml are stale.')
              for e in errors:
                  print(f'  {e}')
              print('Run packwiz refresh on main and commit the result.')
              sys.exit(1)
          else:
              print('Index validation passed.')
          "

      - name: Exclude updater-managed files from Modrinth export
        run: |
          mkdir -p /tmp/createvc-export-excluded

          # FTB Library and any other CurseForge-sourced mod cannot be referenced by
          # the Modrinth pack export, so the CreateVC updater installs them instead.
          ./.github/scripts/exclude-curseforge-mods.sh /tmp/createvc-export-excluded

          # CreateVC Core is updater-managed and must not be packaged as a JAR override.
          if [ -e mods/createvc-core.pw.toml ]; then
            echo "Excluding mods/createvc-core.pw.toml (installed by the CreateVC updater)"
            mv mods/createvc-core.pw.toml /tmp/createvc-export-excluded/
          fi

          # These are first-install-only files managed by the CreateVC updater.
          # Keeping them out of the .mrpack prevents Modrinth App updates from
          # replacing player-local settings before the updater can preserve them.
          for path in \
            config \
            options.txt \
            optionsof.txt \
            servers.dat \
            servers.dat_old
          do
            if [ -e "$path" ]; then
              mv "$path" /tmp/createvc-export-excluded/
            fi
          done

          # Restore pack-managed configs that should ship with every install.
          git checkout config/fml.toml
          git checkout config/simple-custom-early-loading.json
          git checkout config/simple-custom-early-loading/

          # PackUpdater needs its URL before it can bootstrap a fresh install.
          # index.toml marks this config preserve = true so updater runs retain
          # player-local changes after the initial install.
          git checkout config/packupdater.properties

      - name: Export to Modrinth
        run: |
          # packwiz has to download URL-sourced mods to hash them for the Modrinth
          # manifest, and it silently omits a file when that download fails. A retry
          # usually fits a transient CDN error, but publishing a pack that is missing
          # a required jar (including the updater itself) is never acceptable.
          set -o pipefail
          for attempt in 1 2 3 4 5; do
            log="$RUNNER_TEMP/packwiz-export.log"
            if packwiz mr export -o CreateVC.mrpack 2>&1 | tee "$log" \
              && ! grep -qE 'Download of .* failed' "$log"; then
              echo "Export clean on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::Export attempt ${attempt} dropped at least one file after a download failure; retrying."
            sleep 15
          done
          echo "::error::packwiz could not download every URL-sourced mod; refusing to publish an incomplete pack."
          exit 1

      - name: Sanity check - no indexed file was dropped from the mrpack
        run: |
          python3 - <<'PY'
          import glob, json, sys, tomllib, zipfile

          with zipfile.ZipFile('CreateVC.mrpack') as archive:
              manifest = json.loads(archive.read('modrinth.index.json'))
              names = set(archive.namelist())

          # Only the metafiles still present at this point are meant to be exported;
          # the exclusion step has already moved updater-managed and CurseForge ones out.
          expected = []
          for pattern in ('mods/*.pw.toml', 'resourcepacks/*.pw.toml'):
              for metafile in sorted(glob.glob(pattern)):
                  with open(metafile, 'rb') as handle:
                      data = tomllib.load(handle)
                  expected.append((f'{pattern.split("/")[0]}/{data["filename"]}', metafile))

          present = {entry['path'] for entry in manifest['files']}
          missing = [
              f'{path} (from {metafile})'
              for path, metafile in expected
              if path not in present
              and not any(path.rsplit('/', 1)[-1] in name for name in names)
          ]
          if missing:
              print('Export completeness FAILED - indexed files are missing from the mrpack:')
              for item in missing:
                  print(f'  {item}')
              sys.exit(1)
          print(f'Export completeness passed ({len(expected)} indexed files).')
          PY

      - name: Sanity check - ship preserved PackUpdater config
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib
          import zipfile

          path = 'config/packupdater.properties'
          expected = subprocess.check_output(['git', 'show', f'HEAD:{path}'])
          index = tomllib.loads(subprocess.check_output(
              ['git', 'show', 'HEAD:index.toml'], text=True))
          entry = next(item for item in index['files'] if item['file'] == path)
          if entry.get('preserve') is not True:
              raise SystemExit('PackUpdater config must preserve user changes in index.toml')

          properties = dict(
              line.split('=', 1) for line in expected.decode().splitlines()
              if line.strip() and not line.lstrip().startswith('#') and '=' in line
          )
          if properties.get('packupdater.url') != 'https://raw.githubusercontent.com/Jammersmurph/CreateVC/main/pack.toml':
              raise SystemExit('PackUpdater config must point at the main pack')

          with zipfile.ZipFile('CreateVC.mrpack') as archive:
              override = 'overrides/' + path
              if override not in archive.namelist():
                  raise SystemExit('PackUpdater config is missing from the mrpack')
              if archive.read(override) != expected:
                  raise SystemExit('Shipped PackUpdater config differs from the committed defaults')

          print('PackUpdater config ships with configured defaults and preserve = true.')
          PY

      - name: Sanity check - options defaults are updater-only
        run: |
          if unzip -l CreateVC.mrpack | awk '{print $4}' | grep -Eq '^overrides/options(of)?\.txt$'; then
            echo "ERROR: options.txt/optionsof.txt must not ship in the mrpack."
            exit 1
          fi
          git show HEAD:index.toml | grep -Eq '^[[:space:]]*file = "options\.txt"[[:space:]]*$'
          if grep -Eq '^[[:space:]]*options(of)?\.txt[[:space:]]*$' createvc-overwrite-allowlist.txt; then
            echo "ERROR: options.txt/optionsof.txt must never be updater-overwritable."
            exit 1
          fi
          echo "Options updater-only check passed."

      - name: Sanity check - no unexpected override mods
        run: |
          ALLOWED_OVERRIDES="\
            overrides/mods/createsa_tank_fix-
            overrides/mods/createvc_updater_
            client-overrides/mods/\
          "
          FAILED=0
          while IFS= read -r entry; do
            allowed=false
            for pattern in $ALLOWED_OVERRIDES; do
              case "$entry" in
                *"$pattern"*) allowed=true; break;;
              esac
            done
            if [ "$allowed" = false ]; then
              echo "UNEXPECTED OVERRIDE: $entry"
              FAILED=1
            fi
          done < <(unzip -l CreateVC.mrpack 2>/dev/null \
            | awk '{print $4}' \
            | grep -E 'overrides/mods/|client-overrides/mods/')
          if [ "$FAILED" = 1 ]; then
            echo ""
            echo "ERROR: Unexpected override mods found in mrpack."
            echo "Move them to Modrinth metadata in their .pw.toml to fix this."
            exit 1
          fi
          echo "Override mods check passed."

      - name: Commit mrpack to repo
        run: |
          mkdir -p builds
          cp CreateVC.mrpack builds/CreateVC.mrpack

          # See the note in export-dev.yml: rebuild on the current remote tip so
          # the push is a fast-forward and a duplicate run is a no-op.
          artifact="builds/CreateVC.mrpack"
          scratch="${RUNNER_TEMP:-/tmp}/createvc-build-artifact"
          cp "$artifact" "$scratch"

          git config user.name "CreateVC CI"
          git config user.email "actions@github.com"

          git fetch -q origin main
          git reset --hard -q origin/main
          cp "$scratch" "$artifact"

          git add -f builds/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -q -m "update build [skip ci]"
          git push origin HEAD:main

      - name: Upload to Modrinth & set server pack version
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          RESPONSE=$(curl -s -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" \
            -F "data={\"name\":\"$VERSION\",\"version_number\":\"$VERSION\",\"dependencies\":[],\"game_versions\":[\"1.21.1\"],\"version_type\":\"release\",\"loaders\":[\"neoforge\"],\"featured\":true,\"status\":\"listed\",\"project_id\":\"BpnBfkpK\",\"file_parts\":[\"file\"]};type=application/json" \
            -F "file=@CreateVC.mrpack")
          echo "Upload response: $RESPONSE"
          VERSION_ID=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['id'])" 2>/dev/null || true)
          if [ -n "$VERSION_ID" ]; then
            curl -s -X PATCH "https://api.modrinth.com/v3/project/BpnBfkpK" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"minecraft_java_server\":{\"content\":{\"kind\":\"modpack\",\"version_id\":\"$VERSION_ID\"}}}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CreateVC-Exports
          path: CreateVC.mrpack
          compression-level: 0

      - name: Update Modpacks release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Always publish to the rolling release, never the triggering release.
          TAG: Modpacks
        run: |
          gh release upload "$TAG" CreateVC.mrpack --clobber || \
            gh release create "$TAG" CreateVC.mrpack --title "$TAG" --generate-notes
