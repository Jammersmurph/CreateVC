name: Update CreateVC Core
# Trigger immutable Core metadata refresh after published build.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/update-createvc-core.yml"

permissions:
  contents: write

concurrency:
  group: update-createvc-core-dev
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Update CreateVC Core hash
        shell: bash
        run: |
          curl -fsSL --retry 3 -H "Cache-Control: no-cache" "https://downloads.createvc.org/CreateVC-Core.jar?refresh=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o /tmp/CreateVC-Core.jar
          HASH=$(sha256sum /tmp/CreateVC-Core.jar | awk '{print $1}')
          echo "Current CreateVC Core SHA-256: $HASH"
          IMMUTABLE_URL="https://downloads.createvc.org/CreateVC-Core/${HASH}.jar"
          echo "Pinning CreateVC Core to: $IMMUTABLE_URL"
          sed -i -E "s|^url = \".*\"$|url = \"$IMMUTABLE_URL\"|" mods/createvc-core.pw.toml
          sed -i -E "s|^hash = \"[0-9a-fA-F]{64}\"$|hash = \"$HASH\"|" mods/createvc-core.pw.toml

      - name: Refresh Packwiz index
        shell: bash
        run: |
          "$(go env GOPATH)/bin/packwiz" refresh

      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/createvc-core.pw.toml index.toml pack.toml
          if git diff --cached --quiet; then
            echo "CreateVC Core is already current."
            exit 0
          fi
          git commit -m "Update CreateVC Core [skip ci]"
          git pull --rebase origin dev
          git push origin HEAD:dev
