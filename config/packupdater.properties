# PackUpdater configuration for Create VC (main branch).
#
# Shipped in the pack via index.toml, so PackWiz keeps it current and players never
# have to edit anything by hand. Kept in sync by the updater itself: this file is
# pack-managed, so the pack author controls the URL.
#
# Every key can also be set as a JVM argument, e.g. -Dpackupdater.url=<url>.
# JVM arguments take precedence over this file.

# URL of the pack.toml to sync against. Required - the updater does nothing
# without it.
#
# This must be a host that publishes pack.toml and index.toml as one consistent
# snapshot. The installer verifies sha256(index.toml) against the hash declared in
# pack.toml, so any window where the two files come from different versions makes it
# hard-fail with "Your index file hash is invalid".
#
# raw.githubusercontent.com looks tempting because it has no deploy step, but it caches
# each path independently, so right after a push it will happily serve a new pack.toml
# beside a stale index.toml. GitHub Pages publishes the built tree atomically, so the
# pair always matches; it can be a couple of minutes behind main, which is harmless
# because a stale-but-consistent pack just syncs again on the next launch.
#
# It must be a raw file URL. A github.com blob or tree link returns HTML and the
# installer will fail with a 404.
packupdater.url=https://jammersmurph.github.io/CreateVC/pack.toml

# URL of the pack.toml to sync against when packupdater.dev is true. When dev is
# true and this is set, it takes precedence over packupdater.url.
#
# The production pack must leave dev off. Turning it on here would point every
# player's instance at an unreleased development pack.
# packupdater.dev-url=https://raw.githubusercontent.com/Jammersmurph/CreateVC/dev/pack.toml

# Sync packupdater.dev-url instead of packupdater.url. Keep this false on main.
packupdater.dev=false

# GitHub "latest release" API URL for the PackWiz installer that PackUpdater
# bootstraps and self-updates. Defaults to upstream PackWiz, which is what we use:
# it is the well-tested build, and PackUpdater self-updates it on every launch so
# a new installer release is picked up without a pack change.
#
# Note this means createvc-overwrite-allowlist.txt is no longer read by anything.
# The CreateVC fork of the installer honoured it, preserving player-local settings
# such as options.txt, servers.dat and most of config/ unless explicitly listed.
# Upstream has no equivalent, so changed files are handled by the installer's own
# prompt in GUI mode. Point installer-url at
# https://api.github.com/repos/Jammersmurph/packwiz-installer/releases/latest with
# installer-asset=createvc-updater.jar to restore that behaviour.
packupdater.installer-url=https://api.github.com/repos/packwiz/packwiz-installer/releases/latest

# Release asset name to download from that release.
packupdater.installer-asset=packwiz-installer.jar

# Optional GitHub token, only needed for private repositories.
# packupdater.installer-token=

# Show the PackWiz installer's window on launch. This is what exposes the
# installer's optional mods list, and it blocks startup until you close it.
# Set to false for a silent, unattended update; it is forced off automatically
# when there is no display, e.g. on a dedicated server.
packupdater.gui=true

# Skip the updater entirely.
packupdater.skip=false